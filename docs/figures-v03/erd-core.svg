</style><rect width="1500" height="900" fill="white"/><path d="M400,185 L570,185" class="association"/><path d="M930,185 L1080,185" class="association"/><path d="M1260,285 L1260,420 L750,420 L750,500" class="association"/><path d="M400,550 L570,550" class="association"/><rect x="40" y="140" width="360" height="90" rx="3" class="db"/><path d="M40,174 H400" class="association"/><rect x="570" y="140" width="360" height="112" rx="3" class="db"/><path d="M570,174 H930" class="association"/><rect x="1080" y="140" width="360" height="134" rx="3" class="db"/><path d="M1080,174 H1440" class="association"/><rect x="40" y="500" width="360" height="156" rx="3" class="db"/><path d="M40,534 H400" class="association"/><rect x="570" y="500" width="360" height="112" rx="3" class="db"/><path d="M570,534 H930" class="association"/><text x="35" y="42" text-anchor="start" class="title">Logical ERD: rules and input evidence</text><text x="35" y="70" text-anchor="start" class="subtitle">No application-user entity. Creator is a descriptive text label.</text><text x="220.0" y="163" text-anchor="middle" class="label">RULE</text><text x="50" y="194" text-anchor="start" class="small">PK rule_id</text><text x="50" y="216" text-anchor="start" class="small">name, status, owner_label</text><text x="750.0" y="163" text-anchor="middle" class="label">RULE_VERSION</text><text x="580" y="194" text-anchor="start" class="small">PK rule_version_id</text><text x="580" y="216" text-anchor="start" class="small">FK rule_id</text><text x="580" y="238" text-anchor="start" class="small">version, definition, created_by TEXT</text><text x="1260.0" y="163" text-anchor="middle" class="label">EVALUATION</text><text x="1090" y="194" text-anchor="start" class="small">PK evaluation_id</text><text x="1090" y="216" text-anchor="start" class="small">FK rule_version_id</text><text x="1090" y="238" text-anchor="start" class="small">logical_key UNIQUE</text><text x="1090" y="260" text-anchor="start" class="small">outcome, evaluated_at</text><text x="220.0" y="523" text-anchor="middle" class="label">OBSERVATION</text><text x="50" y="554" text-anchor="start" class="small">PK observation_id</text><text x="50" y="576" text-anchor="start" class="small">source, instrument, field</text><text x="50" y="598" text-anchor="start" class="small">decimal_text, unit, mode</text><text x="50" y="620" text-anchor="start" class="small">observed_at, received_at</text><text x="50" y="642" text-anchor="start" class="small">specialization, quality</text><text x="750.0" y="523" text-anchor="middle" class="label">EVALUATION_INPUT</text><text x="580" y="554" text-anchor="start" class="small">PK/FK evaluation_id</text><text x="580" y="576" text-anchor="start" class="small">PK/FK observation_id</text><text x="580" y="598" text-anchor="start" class="small">value snapshot, unit, time</text><text x="485" y="170" text-anchor="middle" class="tiny">1 : 1..*</text><text x="1005" y="170" text-anchor="middle" class="tiny">1 : 0..*</text><text x="980" y="405" text-anchor="middle" class="tiny">1 : 0..*</text><text x="485" y="535" text-anchor="middle" class="tiny">1 : 0..*</text><text x="40" y="790" text-anchor="start" class="small">An evaluation records zero or more eligible input snapshots; an observation can be used by many evaluations.</text><text x="40" y="825" text-anchor="start" class="small">Sources and instruments are validated references in the current SQLite observation table; no user or role lookup is required.</text></svg>