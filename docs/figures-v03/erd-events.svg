all">PK attempt_id</text><text x="1070" y="536" text-anchor="start" class="small">FK intent_id</text><text x="1070" y="558" text-anchor="start" class="small">attempt_no, state, provider_ref</text><text x="225.0" y="483" text-anchor="middle" class="label">AUDIT_EVENT</text><text x="40" y="514" text-anchor="start" class="small">PK event_id</text><text x="40" y="536" text-anchor="start" class="small">actor TEXT, action, target</text><text x="40" y="558" text-anchor="start" class="small">outcome, time, safe_details</text><text x="485" y="170" text-anchor="middle" class="tiny">1 : 0..1</text><text x="1000" y="170" text-anchor="middle" class="tiny">1 : 0..*</text><text x="1310" y="350" text-anchor="middle" class="tiny">1 : 0..*</text><text x="480" y="590" text-anchor="start" class="small">Email intents exist per configured recipient.</text><text x="480" y="620" text-anchor="start" class="small">No recipient does not erase a trigger event.</text></svg>