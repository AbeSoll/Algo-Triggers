small">FK event_id</text><text x="1110" y="248" text-anchor="start" class="small">idempotency_key (unique)</text><text x="1110" y="270" text-anchor="start" class="small">channel, recipient, state</text><text x="1280.0" y="508" text-anchor="middle" class="label">NOTIFICATION_ATTEMPT</text><text x="1110" y="539" text-anchor="start" class="small">PK attempt_id</text><text x="1110" y="561" text-anchor="start" class="small">FK intent_id</text><text x="1110" y="583" text-anchor="start" class="small">attempt_no, provider_reference</text><text x="1110" y="605" text-anchor="start" class="small">state, started_at, completed_at</text><text x="220.0" y="508" text-anchor="middle" class="label">APP_USER</text><text x="50" y="539" text-anchor="start" class="small">PK user_id</text><text x="50" y="561" text-anchor="start" class="small">identity_subject</text><text x="745.0" y="508" text-anchor="middle" class="label">AUDIT_EVENT</text><text x="575" y="539" text-anchor="start" class="small">PK audit_event_id</text><text x="575" y="561" text-anchor="start" class="small">FK actor_id (nullable)</text><text x="575" y="583" text-anchor="start" class="small">action, target, outcome, at</text><text x="415" y="186" text-anchor="start" class="tiny">1</text><text x="520" y="186" text-anchor="start" class="tiny">0..1</text><text x="940" y="186" text-anchor="start" class="tiny">1</text><text x="1050" y="186" text-anchor="start" class="tiny">1..*</text><text x="1292" y="295" text-anchor="start" class="tiny">1</text><text x="1292" y="470" text-anchor="start" class="tiny">0..*</text><text x="415" y="521" text-anchor="start" class="tiny">0..1</text><text x="520" y="521" text-anchor="start" class="tiny">0..*</text><text x="35" y="750" text-anchor="start" class="subtitle">An audit actor can be a system process; actor_id is nullable until the identity model is approved.</text></svg>