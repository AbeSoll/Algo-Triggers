</style><rect width="1700" height="1230" fill="white"/><path d="M105,185 L105,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M330,185 L330,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M610,185 L610,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M900,185 L900,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M1210,185 L1210,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M1510,185 L1510,1160" stroke="#8da4a9" stroke-width="2" stroke-dasharray="6 5"/><path d="M105,230 L330,230" class="edge"/><path d="M330,310 L610,310" class="edge"/><path d="M610,390 L330,390" class="edge"/><path d="M330,485 L900,485" class="edge"/><path d="M330,590 L900,590" class="edge"/><path d="M1210,690 L900,690" class="edge"/><path d="M900,770 L1210,770" class="edge"/><path d="M1210,850 L1510,850" class="edge"/><path d="M1510,930 L1210,930" class="edge"/><path d="M1210,1020 L900,1020" class="edge"/><rect x="15" y="125" width="180" height="60" rx="5" class="external"/><rect x="240" y="125" width="180" height="60" rx="5" class="external"/><rect x="520" y="125" width="180" height="60" rx="5" class="external"/><rect x="810" y="125" width="180" height="60" rx="5" class="external"/><rect x="1120" y="125" width="180" height="60" rx="5" class="external"/><rect x="1420" y="125" width="180" height="60" rx="5" class="external"/><text x="35" y="42" text-anchor="start" class="title">Sequence diagram</text><text x="35" y="70" text-anchor="start" class="subtitle">Scheduled evaluation, persistence and email processing</text><text x="105.0" y="160.0" text-anchor="middle" class="small">Scheduler</text><text x="330.0" y="160.0" text-anchor="middle" class="small">Evaluator</text><text x="610.0" y="160.0" text-anchor="middle" class="small">Data source</text><text x="900.0" y="160.0" text-anchor="middle" class="small">Database / outbox</text><text x="1210.0" y="160.0" text-anchor="middle" class="small">Email worker</text><text x="1510.0" y="160.0" text-anchor="middle" class="small">Email service</text><text x="217" y="219" text-anchor="middle" class="tiny">1. Start scheduled evaluation</text><text x="470" y="299" text-anchor="middle" class="tiny">2. Request eligible observations</text><text x="470" y="379" text-anchor="middle" class="tiny">3. Values, provenance, timestamps</text><text x="620" y="474" text-anchor="middle" class="tiny">4a. If stale/missing: save NOT_EVALUABLE</text><text x="620" y="579" text-anchor="middle" class="tiny">4b. If TRUE and emission allowed: commit event + outbox</text><text x="1055" y="679" text-anchor="middle" class="tiny">5. Claim pending outbox item</text><text x="1055" y="759" text-anchor="middle" class="tiny">6. Return send intent</text><text x="1360" y="839" text-anchor="middle" class="tiny">7. Submit email</text><text x="1360" y="919" text-anchor="middle" class="tiny">8. Accept / reject / timeout</text><text x="1055" y="1009" text-anchor="middle" class="tiny">9. Record attempt and known state</text><text x="850" y="1090" text-anchor="middle" class="small">Steps 5 to 9 follow branch 4b only. No normal event or email is created for branch 4a.</text><text x="850" y="1130" text-anchor="middle" class="small">Provider acceptance is not confirmed inbox delivery. A timeout may require reconciliation before retry.</text></svg>