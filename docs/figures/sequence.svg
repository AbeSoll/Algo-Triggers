<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1230" viewBox="0 0 1700 1230" role="img" aria-label="sequence.svg"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#405d66"/></marker></defs><style>
text{font-family:Arial,sans-serif;fill:#142f37} .title{font-size:26px;font-weight:700} .subtitle{font-size:15px;fill:#50666c}
.label{font-size:17px;font-weight:600} .small{font-size:15px} .tiny{font-size:13px} .box{fill:#f3f8f8;stroke:#42636c;stroke-width:2}
.process{fill:#f0f7f8;stroke:#42636c;stroke-width:2} .external{fill:#e8f2f2;stroke:#42636c;stroke-width:2}
