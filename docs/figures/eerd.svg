ion_id</text><text x="930" y="686" text-anchor="start" class="small">business field context</text><text x="930" y="708" text-anchor="start" class="small">tenor / portfolio context as applicable</text><text x="750" y="490" text-anchor="middle" class="small">d = disjoint; single parent line = partial specialisation</text><text x="750" y="520" text-anchor="middle" class="small">An observation may have no subtype until its classification is agreed.</text><text x="750" y="550" text-anchor="middle" class="small">Synthetic, manual, replay and live are source modes, not these subtypes.</text></svg>